name: Validate vectors

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check -r requirements-validator.txt

      - name: Validate schema, vectors, and manifest
        run: python scripts/validate_vectors.py

      - name: Validate Core-01 vector set
        run: python scripts/validate_core01_vectors.py

      - name: Run validator tests
        run: python -m unittest discover -s tests -v
